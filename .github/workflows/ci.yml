name: Continuous Integration & Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Hygiene & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Linter
        run: |
          ruff check src/ tests/

      - name: Run MyPy Static Type Analysis
        run: |
          mypy src/geocsv --ignore-missing-imports --no-site-packages

  unit-and-property-tests:
    name: Numerical Invariants & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Core & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy scipy pytest pytest-cov hypothesis tinygrad

      - name: Run Pytest with Isometry Coverage
        run: |
          pytest tests/ -v --cov=src/geocsv --cov-report=term-missing --cov-report=xml

      - name: Execute Standalone Proof of Momentum
        run: |
          python examples/iq_stiefel.py
