name: Formal Mathematical Verification (Lean 4)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lean-check:
    name: Formally Check Symplectic Stiefel Theorems
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Elan Lean Version Manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Audit Lean Toolchain Pin
        run: |
          cd formal
          echo "Toolchain target: $(cat lean-toolchain)"
          elan toolchain install $(cat lean-toolchain)
          lean --version

      - name: Build Lean Mathematical Theorems
        run: |
          cd formal
          lake exe cache get || true
          lake build
