[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "geocsv-ai"
version = "1.0.0"
description = "Geometric Computer Systems Validation and Manifold Safety Harness for AI"
authors = ["Principal Investigator <researcher@geocsv.org>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "geocsv", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
torch = ">=2.2.0"
scipy = ">=1.12.0"
numpy = ">=1.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
hypothesis = "^6.98.0"
flake8 = "^7.0.0"
